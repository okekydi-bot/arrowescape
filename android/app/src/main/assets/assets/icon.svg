<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#111f38" />
      <stop offset="60%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Subtle Cyber Grid -->
  <path d="M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384 M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512" stroke="rgba(0, 240, 255, 0.05)" stroke-width="2"/>

  <!-- Outer Neon Border Ring -->
  <rect x="24" y="24" width="464" height="464" rx="95" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="3"/>

  <!-- Cyan Looping Arrow Path -->
  <path d="M 120 380 Q 120 160 360 160" fill="none" stroke="#00f0ff" stroke-width="48" stroke-linecap="round" filter="url(#glowCyan)" />
  <path d="M 120 380 Q 120 160 360 160" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  <polygon points="360,105 440,160 360,215" fill="#00f0ff" filter="url(#glowCyan)" />
  <polygon points="360,125 415,160 360,195" fill="#ffffff" />

  <!-- Orange Looping Arrow Path -->
  <path d="M 392 160 Q 392 380 152 380" fill="none" stroke="#ff9500" stroke-width="48" stroke-linecap="round" filter="url(#glowOrange)" />
  <path d="M 392 160 Q 392 380 152 380" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  <polygon points="152,435 72,380 152,325" fill="#ff9500" filter="url(#glowOrange)" />
  <polygon points="152,415 97,380 152,345" fill="#ffffff" />
</svg>
